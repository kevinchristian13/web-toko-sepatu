{% extends "base.html" %}

{% block title %}Tambah Sepatu - Toko Sepatu Online{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-plus-square me-2"></i>Form Tambah Sepatu Baru</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Sepatu</label>
                            <input type="text" class="form-control" name="nama" placeholder="Contoh: Nike Air Jordan 1" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Kategori</label>
                                <select class="form-select" name="kategori">
                                    <option value="Casual">Casual</option>
                                    <option value="Running">Running</option>
                                    <option value="Basketball">Basketball</option>
                                    <option value="Lifestyle">Lifestyle</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Harga (Rp)</label>
                                <input type="text" class="form-control" name="harga" placeholder="Contoh: 1.500.000" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Jumlah Stok</label>
                            <input type="number" class="form-control" name="stok" placeholder="Contoh: 10" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pilih Foto Sepatu (Dari Komputer/Laptop)</label>
                            <input type="file" class="form-control" name="gambar" accept="image/*">
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('produk') }}" class="btn btn-secondary">Batal</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Simpan Sepatu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
